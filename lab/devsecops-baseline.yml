name: DevSecOps Baseline Security Scan

on:
  workflow_call:
    inputs:
      scan-path:
        description: "Path to scan (defaults to repository root)"
        required: false
        type: string
        default: "."
      trivy-severity:
        description: "Trivy severity filter"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      fail-on-secrets:
        description: "Fail the workflow if secrets are detected"
        required: false
        type: boolean
        default: true
      fail-on-vulnerabilities:
        description: "Fail if critical/high vulnerabilities are found"
        required: false
        type: boolean
        default: false
    secrets:
      GITGUARDIAN_API_KEY:
        description: "GitGuardian API key for ggshield"
        required: true

jobs:
  secrets-scan:
    name: GitGuardian Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        with:
          args: secret scan ci
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base_ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.scan-path }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.fail-on-vulnerabilities && '1' || '0' }}

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-filesystem"

      - name: Print scan summary
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.scan-path }}
          format: "table"
          severity: ${{ inputs.trivy-severity }}
          exit-code: "0"

  scan-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [secrets-scan, trivy-filesystem]
    if: always()

    steps:
      - name: Evaluate results
        run: |
          echo "## DevSecOps Baseline Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.secrets-scan.result }}" == "success" ]; then
            echo "- Secrets Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Secrets Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.trivy-filesystem.result }}" == "success" ]; then
            echo "- Trivy Filesystem Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Trivy Filesystem Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed findings in the Security tab." >> $GITHUB_STEP_SUMMARY

      - name: Fail if secrets detected
        if: inputs.fail-on-secrets && needs.secrets-scan.result == 'failure'
        run: |
          echo "::error::Secrets detected in codebase. Review GitGuardian findings."
          exit 1
